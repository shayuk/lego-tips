name: Deploy to Firebase Hosting on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.11.1

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Preview Channel
        run: |
          firebase hosting:channel:deploy ${{ github.head_ref }} \
            --project lego-tips \
            --expires 7d \
            --json
