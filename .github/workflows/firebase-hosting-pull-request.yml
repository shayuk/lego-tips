name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install dependencies for the main project
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared modules
        run: npm run build:shared

      # Step 2: Install dependencies for the functions folder (THIS IS THE FIX)
      - name: Install Function Dependencies
        run: cd functions && npm install

      # Step 3: Build both the frontend and the functions
      - name: Build Project
        run: npm run build
        
      # Step 4: Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}'
          projectId: lego-tips
          channelId: pr-${{ github.event.pull_request.number }}
