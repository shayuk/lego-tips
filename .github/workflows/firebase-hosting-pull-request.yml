name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Step 1: Install dependencies for the main project
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared modules
        run: npm run build:shared

      - name: Verify shared/lib is up-to-date
        run: |
          echo "=== Checking shared/lib sync ==="
          if ! git diff --exit-code shared/lib; then
            echo "Error: shared/lib is not up-to-date. Run 'npm run build:shared' and commit the changes."
            echo "=== Diff for shared/lib ==="
            git diff -- shared/lib
            exit 1
          fi
          echo "OK: shared/lib is up-to-date."

      # Step 2: Install dependencies for the functions folder (THIS IS THE FIX)
      - name: Install Function Dependencies
        run: cd functions && npm install

      # Step 3: Build both the frontend and the functions
      - name: Build Project
        run: npm run build
        
      # Step 4: Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}'
          projectId: lego-tips
          channelId: pr-${{ github.event.pull_request.number }}
