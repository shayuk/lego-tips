# שם הקובץ: .github/workflows/deploy_to_production.yml (או שם דומה)

name: Deploy to Production
'on':
  push:
    branches:
      - main  # הפעל את התהליך רק בדחיפה לבראנץ' main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # שלב 1: התקנת התלויות של הפרויקט הראשי (Frontend)
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared modules
        run: npm run build:shared

      - name: Verify shared/lib is up-to-date
        run: |
          echo "=== Checking shared/lib sync ==="
          if ! git diff --exit-code shared/lib; then
            echo "Error: shared/lib is not up-to-date. Run 'npm run build:shared' and commit the changes."
            echo "=== Diff for shared/lib ==="
            git diff -- shared/lib
            exit 1
          fi
          echo "OK: shared/lib is up-to-date."

      # שלב 2: התקנת התלויות של הפונקציות (Backend) - זה התיקון הקריטי!
      - name: Install Functions Dependencies
        run: cd functions && npm install

      # שלב 3: בניית כל הפרויקט (Frontend + Functions)
      - name: Build Project
        run: npm run build

      # שלב 3.5: בניית Functions עם BUILD_ID
      - name: Build Functions
        run: cd functions && npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      # שלב 4: התקנת Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # שלב 5: הגדרת Firebase Service Account
      - name: Setup Firebase Auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}' > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
        shell: bash

      # שלב 6: פריסה ל-Firebase Functions
      - name: Deploy Functions
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          ls -la $HOME | head -n 200
          ls -la $HOME/firebase-service-account.json || true
          node -e "const fs=require('fs'); const p=process.env.HOME + '/firebase-service-account.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); console.log('SERVICE_ACCOUNT_CLIENT_EMAIL=' + j.client_email);"
          firebase use lego-tips
          firebase deploy --only functions --project lego-tips --non-interactive
        env:
          GIT_SHA: ${{ github.sha }}
          FIREBASE_CLI_EXPERIMENTS: ""

      # שלב 7: פריסה ל-Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}'
          projectId: lego-tips
          channelId: live
