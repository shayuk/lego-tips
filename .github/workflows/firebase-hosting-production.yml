# שם הקובץ: .github/workflows/deploy_to_production.yml (או שם דומה)

name: Deploy to Production
'on':
  push:
    branches:
      - main  # הפעל את התהליך רק בדחיפה לבראנץ' main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # שלב 1: התקנת התלויות של הפרויקט הראשי (Frontend)
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared modules
        run: npm run build:shared

      - name: Verify shared/lib is up-to-date
        run: |
          echo "=== Checking shared/lib sync ==="
          if ! git diff --exit-code shared/lib; then
            echo "Error: shared/lib is not up-to-date. Run 'npm run build:shared' and commit the changes."
            echo "=== Diff for shared/lib ==="
            git diff -- shared/lib
            exit 1
          fi
          echo "OK: shared/lib is up-to-date."

      # שלב 2: התקנת התלויות של הפונקציות (Backend) - זה התיקון הקריטי!
      - name: Install Functions Dependencies
        run: cd functions && npm install

      # שלב 3: בניית כל הפרויקט (Frontend + Functions)
      - name: Build Project
        run: npm run build
        
      # שלב 4: פריסה ל-Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGO_TIPS }}'
          projectId: lego-tips
          channelId: live
